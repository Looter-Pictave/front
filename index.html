<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Looter Pictave — boutique pop-culture à Poitiers. Figurines, mangas, t-shirts, mugs, statues & jouets d'occasion." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Looter Pictave — Pop Culture &amp; Collections</title>

    <!-- Anti-FOUC : applique le thème sombre AVANT le rendu si l'utilisateur
         l'a choisi, pour éviter un flash blanc au chargement. Doit rester
         cohérent avec stores/theme.js (clé localStorage 'lp_theme'). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('lp_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
