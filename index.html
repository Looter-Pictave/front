<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Looter Pictave — boutique pop-culture à Poitiers. Figurines, mangas, t-shirts, mugs, statues & jouets d'occasion." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Looter Pictave — Pop Culture &amp; Collections</title>

    <!--
      Anti-FOUC : applique le thème AVANT le rendu de la page pour éviter
      un flash blanc/sombre au chargement. Cohérent avec la logique du
      store theme (lp_theme dans localStorage + fallback prefers-color-scheme).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lp_theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'auto'
              ? stored
              : 'auto';
          var theme =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage indisponible (mode privé), on laisse light par défaut */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
